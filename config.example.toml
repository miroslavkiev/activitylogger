# ActivityLogger capture config (F2) defaults
# Copy to ~/.config/activitylogger/config.toml and edit as needed.
# chmod 700 ~/.config/activitylogger && chmod 600 ~/.config/activitylogger/config.toml

[paths]
log_dir = "~/scripts/activitylogger/logs"

[timing]
window_check_sec = 5
flush_interval_sec = 30
typing_pause_sec = 0.5
secure_field_cache_sec = 0.35
diag_min_interval_sec = 30.0
secure_app_check_sec = 0.15

[privacy]
# Default URL mode removes user information and fragments, then neutralizes
# every query name and value. Setting this true may expose sensitive path and
# query data. The loader emits a warning for this explicit unsafe opt-in.
unsafe_full_browser_urls = false
secure_apps = [
  "1password",
  "bitwarden",
  "keychain",
  "keepass",
  "lastpass",
  "passwords",
]

[ax]
ax_queue_maxsize = 16
ax_max_depth = 7
screen_compare_max_chars = 4000
ax_max_children = 40
ax_scan_debounce_sec = 3.0

[window_titles]
activitywatch_enricher = true
activitywatch_base_url = "http://localhost:5600"
# Loopback is required by default. Enabling remote access sends window context
# over the network and emits a warning.
activitywatch_allow_remote = false
aw_backoff_sec = 45.0

[buffers]
max_keystrokes = 2000
max_events = 500
max_sections = 200

[features]
browser_url_capture = false
capture_triggers_enabled = false
scroll_coalesce_enabled = false
scroll_coalesce_ms = 400
