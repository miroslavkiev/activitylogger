    <script src="assets/gsap.min.js"></script>
    <style>

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F9FAFB;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-worth-changing", { x: -1920, duration: 0.4, ease: "power3.inOut" }, 9);
        tl.fromTo("#el-02-ready-window", { x: 1920, opacity: 1 }, { x: 0, duration: 0.4, ease: "power3.inOut" }, 9);
        tl.to("#el-07-signal-stops", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 82);
        tl.fromTo("#el-08-what-it-means", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 82);
        tl.to({}, { duration: 90 }, 0); // full-span anchor - main.duration() == composition total (Studio master duration)
      })();
    </script>
