  <script src="assets/gsap.min.js"></script>
  <script>
    (() => {
      const frame = document.querySelector('[data-composition-id="04-clear-limits"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-clear-limits"] = tl;

      const fileRow = frame.querySelector(".f04-file-row");
      const heroWords = Array.from(frame.querySelectorAll(".f04-hero-word"));
      const pauseCard = frame.querySelector(".f04-pause-card");
      const reasonSlots = Array.from(frame.querySelectorAll(".f04-reason-slot > span"));
      const proofCard = frame.querySelector(".f04-proof-card");
      const proofItems = Array.from(frame.querySelectorAll(".f04-proof-item"));

      tl.fromTo(
        fileRow,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
        0.08,
      );

      let anchorCursor = 0.16;
      const anchorSchedule = heroWords.map((element) => {
        const start = anchorCursor;
        anchorCursor += 0.12 + element.textContent.length * 0.012;
        return { element, start };
      });

      anchorSchedule.forEach(({ element, start }) => {
        tl.fromTo(
          element,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.64, ease: "power3.out" },
          start,
        );
      });

      tl.fromTo(
        pauseCard,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        2.38,
      );

      tl.set(reasonSlots, { opacity: 0 }, 0);
      tl.to(reasonSlots[0], { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.68);
      tl.to(reasonSlots[0], { opacity: 0, duration: 0.16, ease: "power1.out" }, 4.11);
      tl.to(reasonSlots[1], { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.27);
      tl.to(reasonSlots[1], { opacity: 0, duration: 0.16, ease: "power1.out" }, 5.09);
      tl.to(reasonSlots[2], { opacity: 1, duration: 0.2, ease: "power1.out" }, 5.25);

      tl.fromTo(
        proofCard,
        { opacity: 0 },
        { opacity: 1, duration: 0.38, ease: "power2.out" },
        6.96,
      );

      proofItems.forEach((item, index) => {
        const targetX = Number(item.dataset.targetX);
        const targetY = Number(item.dataset.targetY);
        tl.fromTo(
          item,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.42,
            y: targetY * 0.42,
            scale: 0.86,
            opacity: 0,
          },
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 1.2,
            ease: "power3.out",
          },
          7.08 + index * 0.08,
        );
      });

      const holdClock = { progress: 0 };
      tl.to(holdClock, { progress: 1, duration: 2.2, ease: "none" }, 9.8);
    })();
  </script>
