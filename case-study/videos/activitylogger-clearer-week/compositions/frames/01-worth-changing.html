  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-worth-changing"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-worth-changing"] = tl;

      const windowEl = root.querySelector('[class~="01-worth-changing-window"]');
      const titlebar = root.querySelector('[class~="01-worth-changing-titlebar"]');
      const items = root.querySelectorAll('[class~="01-worth-changing-item"]');
      const cursorEl = root.querySelector('[class~="01-worth-changing-cursor"]');

      tl.fromTo(windowEl,
        { opacity: 0, y: 24, scale: 0.985 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
        0.04
      );
      tl.fromTo(titlebar,
        { opacity: 0, y: -18 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        0.16
      );

      items.forEach((item, index) => {
        tl.fromTo(item,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.74, opacity: 0 },
          {
            x: Number(item.dataset.targetX),
            y: Number(item.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 1.2,
            ease: "power3.out"
          },
          0.3 + index * 0.12
        );
      });

      tl.fromTo(cursorEl,
        { opacity: 0, x: 310, y: 130 },
        { opacity: 1, x: 0, y: 0, duration: 1.24, ease: "power2.inOut" },
        0.46
      );

      const words = Array.from(root.querySelectorAll("[data-word]"));
      const weights = words.map((word) => 0.5 + word.textContent.length * 0.11);
      const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
      let usedWeight = 0;

      words.forEach((word, index) => {
        const start = 2.2 + (usedWeight / totalWeight) * 3.5;
        tl.fromTo(word,
          { opacity: 0, x: 44, filter: "blur(10px)" },
          {
            opacity: 1,
            x: 0,
            filter: "blur(0px)",
            duration: 0.66 + Math.min(0.24, word.textContent.length * 0.02),
            ease: "power3.out"
          },
          start
        );
        usedWeight += weights[index];
      });

      tl.fromTo(root.querySelector('[class~="01-worth-changing-question-rule"]'),
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.46, ease: "power3.out" },
        5.34
